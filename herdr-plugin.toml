id = "git-tree"
name = "Git Tree"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Interactive git graph sidebar with real-time updates"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "tree"
title = "Git Tree"
placement = "split"
command = ["target/release/herdr-git-tree"]
platforms = ["linux", "macos"]

[[panes]]
id = "tree-windows"
title = "Git Tree"
placement = "split"
command = ["target/release/herdr-git-tree.exe"]
platforms = ["windows"]

[[actions]]
id = "toggle"
title = "Toggle Git Tree sidebar"
contexts = ["workspace"]
command = ["target/release/herdr-git-tree", "toggle"]
platforms = ["linux", "macos"]

[[actions]]
id = "toggle-windows"
title = "Toggle Git Tree sidebar"
contexts = ["workspace"]
command = ["target/release/herdr-git-tree.exe", "toggle"]
platforms = ["windows"]
